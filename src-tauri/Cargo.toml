[package]
name = "talo"
version = "0.1.0"
description = "Desktop workspace for AI agents"
license = "MIT"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "talo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSColor", "NSImage", "NSView", "NSVisualEffectView", "NSWindow", "NSUserInterfaceItemIdentification", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSString"] }
raw-window-handle = "0.6"
